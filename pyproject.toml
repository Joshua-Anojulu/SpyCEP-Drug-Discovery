[project]
name = "spycep-drug-discovery"
version = "0.1.0"
description = "Reproducible computational anti-virulence target-feasibility workflow for SpyCEP/ScpC."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
receptor-prep = [
  "meeko>=0.7.1",
  "rdkit>=2026.3.3",
  "gemmi>=0.7.5",
  "scipy>=1.18.0",
  "numpy>=2.5.0"
]
figures = [
  "matplotlib>=3.9"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
